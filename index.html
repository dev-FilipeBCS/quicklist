<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quicklist</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <img src="assets/logo.svg" alt="Quicklist logo">
    <span>quicklist</span>
  </header>

  <main>
    <div id="goback">
      <a href="#">
        <img src="assets/voltar.svg" alt="">
      </a>
    </div>
  
    <h1>Compras da semana</h1>

    <form>
      <input type="text" name="itemInput" id="itemInput" placeholder="Adicione um novo item" required />

      <button type="submit">Adicionar item</button>
    </form>

    <fieldset id="items">
    </fieldset>

    <div class="warning-msg">
      <img src="assets/alert.svg" alt="">
      <span>O item foi removido da lista</span>
      <button id="close"><img src="assets/x.svg" alt=""></button>
    </div>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
